<h2 mat-dialog-title>{{ isEdit ? 'Modificar rol' : 'Nuevo rol' }}</h2><mat-dialog-content><form [formGroup]="form" class="form"><mat-form-field appearance="outline"><mat-label>Código</mat-label><input matInput formControlName="code" />@if (form.controls.code.invalid && form.controls.code.touched) { <mat-error>Usa minúsculas, números o guiones.</mat-error> }</mat-form-field><mat-form-field appearance="outline"><mat-label>Nombre</mat-label><input matInput formControlName="name" /></mat-form-field><mat-form-field appearance="outline"><mat-label>Descripción</mat-label><textarea matInput formControlName="description" rows="3"></textarea></mat-form-field><mat-form-field appearance="outline"><mat-label>Permisos</mat-label><mat-select formControlName="permissionIds" multiple>@for (permission of data.permissions; track permission.id) { <mat-option [value]="permission.id">{{ permission.name }} ({{ permission.code }})</mat-option> }</mat-select></mat-form-field></form></mat-dialog-content><mat-dialog-actions align="end"><button mat-button mat-dialog-close>Cancelar</button><button mat-flat-button color="primary" (click)="save()">Guardar</button></mat-dialog-actions>
