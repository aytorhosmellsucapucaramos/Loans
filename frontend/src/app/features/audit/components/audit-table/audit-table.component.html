<div class="table-container">
  <table mat-table [dataSource]="entries">
    <ng-container matColumnDef="createdAt"
      ><th mat-header-cell *matHeaderCellDef>Fecha y hora</th>
      <td mat-cell *matCellDef="let entry">
        {{ entry.createdAt | date: 'dd/MM/yyyy HH:mm:ss' : '' : 'es-PE' }}
      </td></ng-container
    >
    <ng-container matColumnDef="user"
      ><th mat-header-cell *matHeaderCellDef>Usuario responsable</th>
      <td mat-cell *matCellDef="let entry">
        <span>{{ actor(entry) }}</span>
        @if (entry.user) {
          <small>{{ entry.user.email }}</small>
        }
      </td></ng-container
    >
    <ng-container matColumnDef="description"
      ><th mat-header-cell *matHeaderCellDef>Operación</th>
      <td mat-cell *matCellDef="let entry">{{ description(entry) }}</td></ng-container
    >
    <ng-container matColumnDef="result"
      ><th mat-header-cell *matHeaderCellDef>Resultado</th>
      <td mat-cell *matCellDef="let entry">
        <mat-chip [ngClass]="entry.result">{{
          entry.result === 'success' ? 'Correcto' : 'Fallido'
        }}</mat-chip>
      </td></ng-container
    >
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
