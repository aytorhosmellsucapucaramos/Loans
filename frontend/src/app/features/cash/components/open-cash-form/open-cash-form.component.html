<h2 mat-dialog-title>Abrir caja</h2>
<mat-dialog-content
  ><p>Registra el efectivo físico con el que inicia tu turno.</p>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline"
      ><mat-label>Monto inicial</mat-label
      ><input matInput type="number" min="0.01" step="0.01" placeholder="Ej.: 100.00" formControlName="openingAmount" />
      @if (form.controls.openingAmount.touched && form.controls.openingAmount.invalid) {
        <mat-error>Ingresa un monto válido con hasta dos decimales.</mat-error>
      }</mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Observación (opcional)</mat-label
      ><textarea matInput rows="3" formControlName="observations" maxlength="1000"></textarea>
    </mat-form-field></form></mat-dialog-content
><mat-dialog-actions align="end"
  ><button mat-button mat-dialog-close>Cancelar</button
  ><button mat-flat-button color="primary" (click)="save()">Abrir caja</button></mat-dialog-actions
>
