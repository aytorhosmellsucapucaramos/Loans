<section class="page-header"><div><button mat-button (click)="back()"><mat-icon>arrow_back</mat-icon>Pagos</button><p class="eyebrow">Detalle de pago</p><h1>Pago</h1></div>@if (loan() && auth.hasPermission('loans.read')) { <button mat-stroked-button (click)="openLoan()"><mat-icon>account_balance_wallet</mat-icon>Ver préstamo</button> }</section>@if (loading()) { <div class="state"><mat-spinner diameter="40"/><span>Cargando pago…</span></div> } @else if (error()) { <div class="state error"><mat-icon>error</mat-icon><span>{{ error() }}</span><button mat-stroked-button (click)="load()">Reintentar</button></div> } @else { <sp-payment-detail [payment]="payment()" [loan]="loan()" [installment]="installment()"/>@if (installmentPayments().length) { <section class="history"><h2>Historial de la cuota</h2><sp-payments-table [payments]="installmentPayments()" [canCancel]="false" (viewPayment)="viewPayment($event.id)"/></section> } }
