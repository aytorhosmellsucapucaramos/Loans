<section class="page-header"><div><p class="eyebrow">Análisis</p><h1>{{ title() }}</h1><p>Información obtenida directamente de los reportes del backend.</p></div><button mat-stroked-button (click)="back()"><mat-icon>arrow_back</mat-icon>Reportes</button></section><sp-report-filters [form]="filters" [kind]="kind()" (applyFilters)="apply()" (clearFilters)="clear()"/>@if (loading()) { <div class="state"><mat-spinner diameter="40"/><span>Cargando reporte…</span></div> } @else if (error()) { <div class="state error"><mat-icon>error</mat-icon><span>{{ error() }}</span><button mat-stroked-button (click)="load()">Reintentar</button></div> } @else if (report()) { <sp-report-summary-cards [cards]="cards()"/>@if (rows().length) { <sp-report-table [rows]="rows()" [columns]="columns()"/><mat-paginator [length]="total()" [pageIndex]="page()-1" [pageSize]="pageSize()" [pageSizeOptions]="[10,20,50,100]" (page)="changePage($event)" aria-label="Paginación del reporte"/> } @else { <sp-report-empty-state/> } }
