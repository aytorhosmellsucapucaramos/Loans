<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Sistema de Préstamos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('prestameesta_theme');
          const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark-theme');
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#121212' : '#ffffff');
        } catch { /* ThemeService applies the default if browser storage is unavailable. */ }
      })();
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <sp-root></sp-root>
  </body>
</html>
